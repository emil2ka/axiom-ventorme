<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400 800;
        font-display: block;
        src: url('./../public/fonts/manrope-var-cyrillic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400 800;
        font-display: block;
        src: url('./../public/fonts/manrope-var-latin.woff2') format('woff2');
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #090b13;
        color: #f4f6fc;
        font-family: 'Manrope', system-ui, sans-serif;
        overflow: hidden;
        position: relative;
      }
      .glow {
        position: absolute;
        right: -140px;
        top: 50%;
        width: 860px;
        height: 820px;
        transform: translateY(-50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(101, 127, 255, 0.4) 0%, rgba(101, 127, 255, 0.12) 42%, transparent 68%);
      }
      .compass {
        position: absolute;
        right: -170px;
        top: 50%;
        width: 720px;
        height: 700px;
        transform: translateY(-50%);
      }
      .copy {
        position: absolute;
        left: 84px;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 26px;
        max-width: 640px;
      }
      .eyebrow {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: #abb5cb;
        text-transform: uppercase;
      }
      h1 {
        font-size: 92px;
        line-height: 1.02;
        letter-spacing: -0.03em;
        font-weight: 800;
      }
      .accent {
        background: linear-gradient(100deg, #f4f6fc 0%, #afc0ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub {
        font-size: 26px;
        color: #abb5cb;
        font-weight: 600;
      }
      .footer {
        position: absolute;
        left: 84px;
        bottom: 46px;
        font-size: 16px;
        color: #7c87a0;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <svg class="compass" viewBox="0 0 760 760" fill="none">
      <defs>
        <linearGradient id="a" x1="120" y1="40" x2="640" y2="300" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#8BA4FF" />
          <stop offset="1" stop-color="#B79BFF" />
        </linearGradient>
        <linearGradient id="b" x1="620" y1="500" x2="140" y2="720" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#B79BFF" />
          <stop offset="1" stop-color="#85E2C9" />
        </linearGradient>
        <linearGradient id="d" x1="420" y1="120" x2="740" y2="560" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#85E2C9" />
          <stop offset="1" stop-color="#8BA4FF" />
        </linearGradient>
        <radialGradient id="c">
          <stop offset="0" stop-color="#F4F6FC" stop-opacity="0.95" />
          <stop offset="0.32" stop-color="#8BA4FF" stop-opacity="0.75" />
          <stop offset="1" stop-color="#8BA4FF" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle cx="380" cy="380" r="170" fill="url(#c)" opacity="0.4" />
      <circle cx="380" cy="380" r="64" fill="url(#c)" />
      <circle cx="380" cy="380" r="7" fill="#F4F6FC" opacity="0.9" />
      <path d="M 200 100 A 348 348 0 0 1 660 300" stroke="url(#a)" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />
      <path d="M 90 260 A 348 348 0 0 0 120 540" stroke="url(#a)" stroke-width="1.4" stroke-linecap="round" opacity="0.4" />
      <path d="M 180 610 A 300 300 0 0 0 620 480" stroke="url(#b)" stroke-width="1.3" stroke-linecap="round" opacity="0.45" />
      <path d="M 470 60 A 280 280 0 0 1 700 340" stroke="url(#d)" stroke-width="1.1" stroke-linecap="round" opacity="0.35" />
      <path d="M 140 120 A 360 360 0 0 1 620 700" stroke="#8BA4FF" stroke-width="1" stroke-dasharray="1.5 10" stroke-linecap="round" opacity="0.4" />
      <circle cx="238" cy="52" r="5" fill="#8BA4FF" />
      <circle cx="705" cy="290" r="5" fill="#B79BFF" />
      <circle cx="585" cy="662" r="5" fill="#85E2C9" />
      <circle cx="163" cy="655" r="5" fill="#F1C68A" />
      <circle cx="55" cy="265" r="5" fill="#F0A6C0" />
      <g stroke="#ABB5CB" stroke-width="1" opacity="0.35">
        <path d="M 400 46 V 58" />
        <path d="M 668 220 H 680" />
        <path d="M 660 560 L 670 566" />
        <path d="M 240 660 H 252" />
        <path d="M 96 330 V 342" />
      </g>
    </svg>
    <div class="copy">
      <p class="eyebrow">Профессия · Учёба · Следующий шаг</p>
      <h1>Выбери <span class="accent">свой путь</span></h1>
      <p class="sub">Знакомство с Ventorme</p>
    </div>
    <p class="footer">Страница команды Hacknext 2026</p>
  </body>
</html>
